name: Deploy docs (mike)
on:
  push:
    tags:
      - 'v*'     # e.g., v1.0, v1.1

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # <-- important for mike/gh-pages history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
            mkdocs-bibtex-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'      # 14 is EOL; bump if you actually need Node

      - name: Install Node.js dependencies (optional)
        run: npm install js-yaml  # keep only if your build really uses it

      - name: Install Python deps
        run: |
          pip install mike mkdocs-material mkdocs-bibtex
          pip install https://github.com/mitya57/python-markdown-math/archive/master.zip

      - name: Deploy with mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME}"            # tag name, e.g. v1.0
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default latest --push
